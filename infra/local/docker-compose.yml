# Local test environment of Hostrema: the same image that goes to production (built from this
# checkout), PostgreSQL, Redis, the realtime server, a mail catcher and one local node.
# Use ./hostrema-local.sh, which generates the .env and prepares everything (docs/platform.md,
# "Testar em localhost").
name: hostrema-local

services:
  hostrema:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      args:
        # The default base of the official Dockerfile is a private image of Coolify.
        SERVERSIDEUP_PHP_IMAGE: serversideup/php:8.4-fpm-nginx-alpine
    image: hostrema-local:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_URL: http://localhost:${HOSTREMA_PORT:-8000}
      PUSHER_PORT: ${HOSTREMA_REALTIME_PORT:-6001}
      PHP_MEMORY_LIMIT: 512M
      PHP_FPM_PM_CONTROL: dynamic
      PHP_FPM_PM_START_SERVERS: 1
      PHP_FPM_PM_MIN_SPARE_SERVERS: 1
      PHP_FPM_PM_MAX_SPARE_SERVERS: 10
    ports:
      - "${HOSTREMA_PORT:-8000}:8080"
    volumes:
      - hostrema-ssh:/var/www/html/storage/app/ssh
      - hostrema-backups:/var/www/html/storage/app/backups
    networks:
      default:
        # The realtime server calls the application as "coolify".
        aliases: [coolify]
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      soketi:
        condition: service_started
      mailpit:
        condition: service_started

  # New volumes belong to root; the application runs as www-data (uid 9999, as in production).
  storage-init:
    image: busybox:stable
    restart: "no"
    command: ["sh", "-c", "mkdir -p /ssh/keys /ssh/mux /backups && chown -R 9999:9999 /ssh /backups && chmod 700 /ssh /ssh/keys"]
    volumes:
      - hostrema-ssh:/ssh
      - hostrema-backups:/backups

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-hostrema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./hostrema-local.sh to create the .env}
      POSTGRES_DB: ${DB_DATABASE:-hostrema}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning --requirepass "${REDIS_PASSWORD:?run ./hostrema-local.sh to create the .env}"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  soketi:
    image: ghcr.io/coollabsio/coolify-realtime:1.0.10
    restart: unless-stopped
    environment:
      APP_NAME: Hostrema
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
    ports:
      - "${HOSTREMA_REALTIME_PORT:-6001}:6001"
      - "${HOSTREMA_TERMINAL_PORT:-6002}:6002"
    volumes:
      - hostrema-ssh:/var/www/html/storage/app/ssh
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      default:
        # Default address of the realtime server for the application (PUSHER_BACKEND_HOST).
        aliases: [coolify-realtime]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${HOSTREMA_MAIL_PORT:-8025}:8025"

  # The node of the "local" region: Docker-in-Docker with SSH. Ports 80/443 of your machine go to
  # its Traefik, so the applications answer on http://<name>.localhost.
  hostrema-node:
    build: ./node
    image: hostrema-local-node:latest
    restart: unless-stopped
    privileged: true
    hostname: hostrema-node
    ports:
      - "${HOSTREMA_APPS_HTTP_PORT:-80}:80"
      - "${HOSTREMA_APPS_HTTPS_PORT:-443}:443"
    volumes:
      - node-docker:/var/lib/docker
      - node-data:/data/coolify
      - node-ssh:/root/.ssh

volumes:
  hostrema-ssh:
  hostrema-backups:
  postgres-data:
  redis-data:
  node-docker:
  node-data:
  node-ssh:
