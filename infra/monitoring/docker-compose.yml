# Regional observability stack (wiki 6 & 8): Prometheus + Alertmanager + Grafana + Loki + Blackbox.
# Runs on the region control node. Node agents (node_exporter, cAdvisor, Alloy) are installed on
# every execution node by infra/ansible/roles/monitoring-agent.
#
#   cp .env.example .env && docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
      - --enable-feature=expand-external-labels
    environment:
      - REGION=${REGION:?set REGION}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      # Alloy agents on the nodes push here and the dashboard reads the tenant logs (log viewer)
      # through the private network only.
      - "${PRIVATE_BIND_IP:-127.0.0.1}:3100:3100"
    networks: [monitoring]

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    networks: [monitoring]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: --config=/etc/otelcol/config.yml
    environment:
      - REGION=${REGION:?set REGION}
    volumes:
      - ./otel-collector:/etc/otelcol:ro
    ports:
      - "${PRIVATE_BIND_IP:-127.0.0.1}:4317:4317"
      - "${PRIVATE_BIND_IP:-127.0.0.1}:4318:4318"
    networks: [monitoring]

  # Tenant traces (wiki 6/8): enable with `docker compose --profile tenant-traces up -d`
  # after pointing OTLP_DOMAIN to this node (ports 80/443 open).
  otlp-gateway:
    image: traefik:v3.3
    restart: unless-stopped
    profiles: [tenant-traces]
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --ping=true
    environment:
      - OTLP_DOMAIN=${OTLP_DOMAIN:-}
      - COOLIFY_URL=${COOLIFY_URL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./otlp-gateway:/etc/traefik:ro
      - otlp-acme:/acme
    networks: [monitoring]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring]

networks:
  monitoring: {}

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  tempo-data: {}
  otlp-acme: {}
  loki-data: {}
  grafana-data: {}
