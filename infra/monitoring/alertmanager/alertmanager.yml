# Example receivers. infra/ansible/roles/monitoring-stack renders this file from the inventory
# (alert_email_to, smtp_*, alert_slack_webhook_url); edit it by hand when running compose alone.
global:
  smtp_smarthost: smtp.example.com:587
  smtp_from: alerts@example.com
  smtp_require_tls: true

route:
  receiver: ops-email
  group_by: [alertname, region]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ops-email
    email_configs:
      - to: ops@example.com
        send_resolved: true
