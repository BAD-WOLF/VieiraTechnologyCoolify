auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h          # 30 days (raise per plan with per-stream retention below)
  max_query_series: 5000
  retention_stream:
    - selector: '{tenant_plan="enterprise"}'
      priority: 1
      period: 2160h               # 90 days for enterprise

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
