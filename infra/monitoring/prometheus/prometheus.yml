global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    region: sa-east-1   # one Prometheus per region; federate/remote_write to a central store if needed

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Execution nodes (private IPs). Keep this list in sync with the inventory, or use file_sd.
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/nodes.yml']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: node
        replacement: '$1'

  # cAdvisor exposes every container with its docker labels as container_label_*; the platform
  # hardening sets tenant_id/tenant_plan on every tenant container (copied here as plain labels).
  - job_name: cadvisor
    file_sd_configs:
      - files: ['/etc/prometheus/targets/cadvisor.yml']
    metric_relabel_configs:
      - source_labels: [container_label_tenant_id]
        target_label: tenant_id
      - source_labels: [container_label_tenant_plan]
        target_label: tenant_plan
      - source_labels: [container_label_coolify_resourceName]
        target_label: resource
      - regex: 'container_label_(com_docker_compose_.*|org_opencontainers_.*|traefik_.*|caddy.*)'
        action: labeldrop

  # Coolify control plane (tenants, deployments, allocations, invoices, queues).
  - job_name: coolify
    scheme: https
    metrics_path: /api/v1/platform/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/platform_metrics_token
    static_configs:
      - targets: ['coolify.example.com']

  # Synthetic checks of public endpoints (control plane, regional LB, status pages).
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://coolify.example.com/api/health
          - https://status.apps.example.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
