# OTLP entry point of the region (operator components such as the edge routers). Tenant
# containers can not reach it (infra/ansible/roles/firewall): traces of tenant applications would
# need an authenticated gateway that sets tenant_id.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  resource:
    attributes:
      - key: region
        value: ${env:REGION}
        action: upsert
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
