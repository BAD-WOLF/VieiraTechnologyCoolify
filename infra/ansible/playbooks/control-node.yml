# Region control node: bastion, WireGuard endpoint of the Coolify control plane, registry
# mirror and the regional observability stack (infra/monitoring).
- name: Region control node
  hosts: control
  become: true
  # Automatic security updates may hold the apt lock for a while: wait for it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
  roles:
    - common
    - docker
    - firewall
    - role: wireguard
      when: wireguard_enabled | bool
    - registry-mirror
    - monitoring-stack
