# A new instance may still be finishing its first boot (cloud-init) and installing security updates
# (apt-daily): wait for both, or the package tasks below would fail on the apt lock.
- name: Look for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: common_cloud_init

- name: Wait for the first boot to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false
  when: common_cloud_init.stat.exists

- name: Wait for the automatic package updates to finish
  ansible.builtin.command: >-
    systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true
  changed_when: false
  when: ansible_facts.service_mgr == 'systemd'

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Kernel and network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-platform.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-platform.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Audit rules for Docker and SSH
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/platform.rules
    mode: "0640"
  notify: Restart auditd

- name: Bound journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/platform.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=2G
      MaxRetentionSec=30day
  notify: Restart journald

- name: Locate the data volume
  ansible.builtin.stat:
    path: "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_{{ data_volume_id | replace('-', '') }}"
  register: common_data_volume
  when: data_volume_id | default('') | length > 0

- name: Create the data file system (only when the volume is empty)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ common_data_volume.stat.lnk_source }}"
  when: common_data_volume.stat.exists | default(false)

- name: Mount the data volume
  ansible.posix.mount:
    path: "{{ common_data_mount }}"
    src: "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_{{ data_volume_id | replace('-', '') }}"
    fstype: ext4
    opts: defaults,noatime,nofail
    state: mounted
  when: common_data_volume.stat.exists | default(false)

- name: Data directory
  ansible.builtin.file:
    path: "{{ common_data_mount }}"
    state: directory
    mode: "0755"
