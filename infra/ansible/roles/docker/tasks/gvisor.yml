- name: Add the gVisor apt repository
  ansible.builtin.deb822_repository:
    name: gvisor
    types: [deb]
    uris: https://storage.googleapis.com/gvisor/releases
    suites: [release]
    components: [main]
    architectures: ["{{ docker_arch }}"]
    signed_by: https://gvisor.dev/archive.key

- name: Install runsc
  ansible.builtin.apt:
    name: runsc
    state: present
    update_cache: true
