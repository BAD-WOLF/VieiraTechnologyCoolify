- name: Agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ monitoring_agent_dir }}"
    - /data/promtail

- name: Promtail configuration (tenant_id labels from the container labels)
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: "{{ monitoring_agent_dir }}/promtail.yml"
    mode: "0640"
  notify: Restart monitoring agents

- name: Agents compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_agent_dir }}/docker-compose.yml"
    mode: "0640"

- name: Start node_exporter, cAdvisor and Promtail
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_agent_dir }}"
    state: present
    pull: missing
