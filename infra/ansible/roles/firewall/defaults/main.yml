# Host ports containers must never reach (SSH, exporters, edge router, Alloy, Loki).
firewall_management_ports: [22, 3100, 4317, 4318, 9100, 9280, 10080, 10082, 10083, 10443, 12345]
# Destinations blocked for container traffic: the metadata service everywhere and, on the
# execution nodes, the private network of the region, the WireGuard network and the peered
# control plane network as well (the control node only runs operator containers, e.g.
# Prometheus scraping the nodes).
firewall_blocked_destinations: >-
  {{ ['169.254.0.0/16']
     + ([vpc_cidr, wireguard_network | default('10.99.0.0/24')] if inventory_hostname in groups.get('coolify_nodes', []) else [])
     + ([control_plane_vpc_cidr] if (control_plane_vpc_cidr | default('') | length > 0) else []) }}
