# Host ports containers must never reach (SSH, exporters, edge router, Promtail, Loki).
firewall_management_ports: [22, 3100, 4317, 4318, 9080, 9100, 9280, 10080, 10082, 10083, 10443]
# Destinations blocked for container traffic: the metadata service everywhere and, on the
# execution nodes, the private network of the region and the WireGuard network as well
# (the control node only runs operator containers, e.g. Prometheus scraping the nodes).
firewall_blocked_destinations: >-
  {{ ['169.254.0.0/16']
     + ([vpc_cidr, wireguard_network | default('10.99.0.0/24')] if inventory_hostname in groups.get('coolify_nodes', []) else []) }}
