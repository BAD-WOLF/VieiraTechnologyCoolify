# Edge router of the region (wiki 2, "Load Balancer regional"): the load balancer sends :80 and
# :443 of every public host to any node; the edge forwards each host to the node(s) running it
# (configuration served by Coolify at /api/v1/platform/edge/<region>).
- name: Edge directory
  ansible.builtin.file:
    path: "{{ edge_dir }}"
    state: directory
    mode: "0750"

- name: Edge static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ edge_dir }}/traefik.yml"
    mode: "0640"
  notify: Restart edge

- name: Edge compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ edge_dir }}/docker-compose.yml"
    mode: "0640"

- name: Start the edge router
  community.docker.docker_compose_v2:
    project_src: "{{ edge_dir }}"
    state: present
    pull: missing

- name: Wait for the edge health check
  ansible.builtin.uri:
    url: "http://{{ private_ip }}:{{ edge_health_port }}/ping"
  register: edge_ping
  until: edge_ping.status == 200
  retries: 12
  delay: 5
