# Settings shared by every region. Secrets come from inventory/group_vars/all/vault.yml
# (ansible-vault encrypt group_vars/all/vault.yml), see vault.yml.example.

# --- Coolify control plane (master) -------------------------------------------------------
coolify_url: "https://cloud.example.com"
# API token of the root team (Keys & Tokens > API tokens) with read + write permissions.
coolify_api_token: "{{ vault_coolify_api_token }}"
# Private key Coolify uses to reach the nodes (Keys & Tokens > Private Keys). The public part is
# read from Coolify on every run; the one of the vault is only revoked once it is not the current
# key anymore (after playbooks/rotate-coolify-key.yml).
coolify_private_key_uuid: "{{ vault_coolify_private_key_uuid }}"
coolify_ssh_public_key: "{{ vault_coolify_ssh_public_key | default('') }}"
coolify_ssh_user: root
# Source addresses allowed to use that key: the control node (WireGuard exit) and, with the VPC
# peering of Terraform (control_plane_peering), the control plane network.
coolify_ssh_from: "{{ [control_private_ip] + ([control_plane_vpc_cidr] if (control_plane_vpc_cidr | default('') | length > 0) else []) }}"
coolify_validate_timeout: 900
coolify_no_log: true

# --- Platform ----------------------------------------------------------------------------
platform_region_name: "São Paulo"
# Wildcard domain of the region nodes: new applications get https://<random>.apps.example.com
platform_apps_wildcard: "https://apps.example.com"
platform_edge_token: "{{ vault_platform_edge_token }}"
platform_metrics_token: "{{ vault_platform_metrics_token }}"

# --- Docker ------------------------------------------------------------------------------
docker_data_root: /data/docker
# One network per tenant and node: the default Docker pools only fit ~30 networks.
# Must not overlap the VPC (vpc_cidr) nor the WireGuard network.
docker_address_pools:
  - base: 10.200.0.0/14
    size: 24
docker_log_max_size: 10m
docker_log_max_file: 3
# gVisor (runsc) installed on every node, so PLATFORM_CONTAINER_RUNTIME=runsc is enough to
# sandbox the tenants of the shared nodes (dedicated VMs keep the native runtime).
docker_gvisor_enabled: true

# --- Registry mirror (control node) ------------------------------------------------------
registry_mirror_enabled: true
registry_mirror_port: 5000
registry_private_enabled: false
registry_private_port: 5443
registry_users: "{{ vault_registry_users | default([]) }}"
dockerhub_username: "{{ vault_dockerhub_username | default('') }}"
dockerhub_token: "{{ vault_dockerhub_token | default('') }}"

# --- WireGuard (Coolify control plane <-> region) -------------------------------------------
# Not needed when the region is peered with the control plane VPC (control_plane_peering).
wireguard_enabled: "{{ (control_plane_vpc_cidr | default('') | length) == 0 }}"
wireguard_port: 51820
wireguard_address: 10.99.0.1/24
wireguard_network: 10.99.0.0/24
wireguard_private_key: "{{ vault_wireguard_private_key | default('') }}"
wireguard_peers:
  - name: coolify-control-plane
    public_key: "{{ vault_wireguard_control_plane_public_key | default('') }}"
    allowed_ips: 10.99.0.2/32

# --- Monitoring ----------------------------------------------------------------------------
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_root_url: "https://grafana.{{ platform_region }}.example.com"
alert_email_to: ops@example.com
alert_slack_webhook_url: "{{ vault_alert_slack_webhook_url | default('') }}"
smtp_smarthost: smtp.example.com:587
smtp_from: alerts@example.com
smtp_username: "{{ vault_smtp_username | default('') }}"
smtp_password: "{{ vault_smtp_password | default('') }}"
blackbox_targets: []
# Public OTLP endpoint of the region for tenant traces (DNS -> control node). Empty = disabled.
otlp_domain: "otlp.{{ platform_region }}.hostrema.com.br"
acme_email: "{{ alert_email_to }}"
