# Example inventory. `terraform apply` in infra/terraform/regions/<region> writes the real one
# (inventory/<region>.yml) with the addresses of the instances it created.
all:
  vars:
    platform_region: sa-east-1
    vpc_cidr: 10.20.0.0/16
    backup_bucket: vtc-sa-east-1-backups-123456789012
    control_private_ip: 10.20.0.10
    edge_http_port: 10080
    edge_https_port: 10443
    edge_health_port: 10082
  children:
    control:
      hosts:
        vtc-sa-east-1-control:
          ansible_host: 203.0.113.50
          private_ip: 10.20.0.10
          data_volume_id: vol-0123456789abcdef0
    coolify_nodes:
      vars:
        ansible_ssh_common_args: "-o ProxyJump=ubuntu@203.0.113.50"
      hosts:
        vtc-sa-east-1-node-01:
          ansible_host: 10.20.128.10
          private_ip: 10.20.128.10
          public_ip: ""
          data_volume_id: vol-0123456789abcdef1
        vtc-sa-east-1-node-02:
          ansible_host: 10.20.144.10
          private_ip: 10.20.144.10
          public_ip: ""
          data_volume_id: vol-0123456789abcdef2
          # Enterprise: reserve this node for one tenant (team id in Coolify).
          # platform_dedicated_team_id: 42
